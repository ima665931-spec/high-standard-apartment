<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Status — High Standard Apartment, Jaipur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F5EFE3; --ivory-dim:#EDE4D2; --ink:#1C2430; --ink-soft:#3A4250;
  --sandstone:#B85C33; --sandstone-deep:#8C4525; --line: rgba(28,36,48,0.14); --radius:2px;
  --error:#A23B3B; --ok:#3E7A52; --pending:#B8870F;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{ background:var(--ivory); color:var(--ink); font-family:'Work Sans', sans-serif; line-height:1.6; }
h1,h2{ font-family:'Fraunces', serif; font-weight:600; }
a{ color:inherit; text-decoration:none; }
.mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.06em; text-transform:uppercase; font-size:0.72rem; }
.wrap{ max-width:520px; margin:0 auto; padding:0 20px; }
header{ background:rgba(245,239,227,0.92); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
nav.wrap{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; }
.brand{ font-family:'Fraunces', serif; font-weight:600; font-size:1.05rem; }
.brand .dot{ color:var(--sandstone); }
.back-link{ font-family:'IBM Plex Mono', monospace; font-size:0.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); }
main{ padding:40px 0 80px; }
.num-tag{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--sandstone-deep); letter-spacing:.1em; text-transform:uppercase; margin-bottom:10px; display:block; }
h1{ font-size:clamp(1.6rem,4vw,2.1rem); margin-bottom:10px; }
.lead{ color:var(--ink-soft); font-size:0.95rem; margin-bottom:28px; }
.card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:24px; }
.field{ margin-bottom:16px; }
.field label{ display:block; font-family:'IBM Plex Mono', monospace; font-size:0.68rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; color:var(--ink-soft); }
.field input{
  width:100%; padding:14px 16px; border:1px solid var(--line); background:var(--ivory);
  font-family:'Work Sans', sans-serif; font-size:0.95rem; border-radius:var(--radius); outline:none;
}
.field input:focus{ border-color:var(--sandstone); }
.btn{
  width:100%; margin-top:8px; background:var(--sandstone); color:var(--ivory); border:1px solid var(--sandstone);
  padding:14px; font-family:'IBM Plex Mono', monospace; font-size:0.78rem; text-transform:uppercase; letter-spacing:.06em;
  border-radius:var(--radius); cursor:pointer;
}
.btn:disabled{ opacity:.6; cursor:not-allowed; }
.err{ color:var(--error); font-size:0.82rem; margin-top:12px; display:none; }
.result{ display:none; margin-top:24px; }
.result.show{ display:block; }
.badge{
  display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:0.7rem; text-transform:uppercase;
  letter-spacing:.06em; padding:6px 12px; border-radius:var(--radius); margin-bottom:14px;
}
.badge.pending{ background:#F5E6B8; color:#7A5C00; }
.badge.confirmed{ background:#D4EDDA; color:#1E5C2E; }
.badge.rejected{ background:#F8D7DA; color:#8B1E1E; }
.result h2{ font-size:1.25rem; margin-bottom:8px; }
.result p{ color:var(--ink-soft); margin-bottom:14px; }
.meta{ font-size:0.9rem; border-top:1px solid var(--line); padding-top:12px; }
.meta div{ display:flex; justify-content:space-between; gap:12px; padding:6px 0; }
.meta span:last-child{ font-family:'IBM Plex Mono', monospace; font-size:0.78rem; text-align:right; }
.hint{ margin-top:20px; font-size:0.82rem; color:var(--ink-soft); text-align:center; }
</style>
</head>
<body>
<header>
<nav class="wrap">
<div class="brand">High Standard<span class="dot">•</span>Apartment</div>
<a href="index.html" class="back-link">← Listings</a>
</nav>
</header>
<main>
<div class="wrap">
<span class="num-tag">Notice / Status</span>
<h1>Check your visit status</h1>
<p class="lead">Enter the Booking ID and mobile number you used while booking. Status updates after we verify your UTR. No email is sent — check here.</p>

<div class="card">
<div class="field">
<label for="bookingId">Booking ID</label>
<input type="text" id="bookingId" placeholder="e.g. HSA-A1B2C3D4" autocomplete="off">
</div>
<div class="field">
<label for="mobile">Mobile Number</label>
<input type="tel" id="mobile" placeholder="10-digit mobile" maxlength="10" inputmode="numeric">
</div>
<button type="button" class="btn" id="checkBtn">Check Status</button>
<p class="err" id="errBox"></p>

<div class="result" id="resultBox">
<span class="badge" id="statusBadge">Pending</span>
<h2 id="resultTitle">Status</h2>
<p id="resultMsg"></p>
<div class="meta" id="resultMeta"></div>
</div>
</div>

<p class="hint">Saved a booking on this phone? We auto-fill from your last request.</p>
</div>
</main>

<script>
// Vercel serverless API — same-origin, plain fetch (no JSONP needed anymore)
const API_URL = '/api/status';

// Prefill from localStorage
try {
  const saved = JSON.parse(localStorage.getItem('hsa_last_booking') || 'null');
  if (saved) {
    if (saved.bookingId) document.getElementById('bookingId').value = saved.bookingId;
    if (saved.mobile) document.getElementById('mobile').value = saved.mobile;
  }
} catch (e) {}

function showErr(msg) {
  const el = document.getElementById('errBox');
  el.style.display = msg ? 'block' : 'none';
  el.textContent = msg || '';
}

function renderStatus(data) {
  const box = document.getElementById('resultBox');
  const badge = document.getElementById('statusBadge');
  const st = String(data.status || 'Pending');
  const low = st.toLowerCase();

  badge.className = 'badge pending';
  if (low.indexOf('confirm') >= 0 && low.indexOf('not') < 0) badge.className = 'badge confirmed';
  else if (low.indexOf('not') >= 0 || low.indexOf('reject') >= 0) badge.className = 'badge rejected';
  badge.textContent = st;

  document.getElementById('resultTitle').textContent = st;
  document.getElementById('resultMsg').textContent = data.message || '';
  document.getElementById('resultMeta').innerHTML = [
    ['Booking ID', data.bookingId],
    ['Flat', data.propertyTitle],
    ['Area', data.area],
    ['Visit', (data.visitDate || '') + (data.visitSlot ? ' · ' + data.visitSlot : '')],
    ['UTR', data.utr]
  ].map(function(row){
    return '<div><span>' + row[0] + '</span><span>' + (row[1] || '—') + '</span></div>';
  }).join('');

  box.classList.add('show');

  try {
    const saved = JSON.parse(localStorage.getItem('hsa_last_booking') || '{}');
    saved.status = st;
    saved.bookingId = data.bookingId;
    localStorage.setItem('hsa_last_booking', JSON.stringify(saved));
  } catch (e) {}
}

async function checkStatus() {
  const id = document.getElementById('bookingId').value.trim().toUpperCase();
  const mobile = document.getElementById('mobile').value.trim().replace(/\D/g, '');

  showErr('');
  document.getElementById('resultBox').classList.remove('show');

  if (!id || id.length < 6) { showErr('Enter a valid Booking ID'); return; }
  if (mobile.length !== 10) { showErr('Enter a valid 10-digit mobile number'); return; }

  const btn = document.getElementById('checkBtn');
  btn.disabled = true;
  btn.textContent = 'Checking…';

  try {
    const url = API_URL + '?id=' + encodeURIComponent(id) + '&mobile=' + encodeURIComponent(mobile);
    const resp = await fetch(url);
    const data = await resp.json();

    if (!data || !data.ok) {
      showErr((data && data.error) || 'Could not find this booking');
    } else {
      renderStatus(data);
    }
  } catch (err) {
    console.error(err);
    showErr('Could not reach server. Please try again in a minute.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Check Status';
  }
}

document.getElementById('checkBtn').addEventListener('click', checkStatus);
</script>
</body>
</html>
